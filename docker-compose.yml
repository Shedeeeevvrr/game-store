services:
  mongo:
    image: mongo:7
    container_name: gamestore-mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
  backend:
    build: ./backend
    container_name: gamestore-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/gamestore
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    container_name: gamestore-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  mongo_data:
